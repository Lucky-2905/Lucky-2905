<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a18"/>
      <stop offset="0.5" stop-color="#0c2340"/>
      <stop offset="1" stop-color="#050a18"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dd3fc" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .star { fill: #e0f2fe; animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .1; } 50% { opacity: 1; } }

    .orb { animation: float 9s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-24px); } }

    .sym { font-family: 'Courier New', monospace; font-size: 30px; font-weight: 700; fill: #7dd3fc; opacity: .3; animation: drift 10s ease-in-out infinite; }
    @keyframes drift { 0%,100% { transform: translateY(0); opacity: .2; } 50% { transform: translateY(-18px); opacity: .5; } }

    .title { font-family: 'Segoe UI', Arial, sans-serif; font-size: 92px; font-weight: 800; letter-spacing: 4px; animation: rise 1.4s ease-out both, pulse 4s ease-in-out 1.4s infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .82; } }

    .sub { font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; letter-spacing: 3px; fill: #bae6fd; animation: rise 1.4s .6s ease-out both; }
    .tag { font-family: 'Courier New', monospace; font-size: 18px; letter-spacing: 2px; fill: #7dd3fc; animation: rise 1.4s 1.1s ease-out both; }

    .scan { animation: sweep 6s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-400px); } 100% { transform: translateX(1200px); } }

    .w1 { fill: #7dd3fc; opacity: .22; animation: slide 14s linear infinite; }
    .w2 { fill: #7dd3fc; opacity: .38; animation: slide 9s linear infinite; }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-300px); } }
  </style>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- glowing orbs -->
  <circle class="orb" cx="170" cy="90" r="120" fill="url(#orb)"/>
  <circle class="orb" cx="1020" cy="120" r="150" fill="url(#orb)" style="animation-delay:-4s"/>

  <!-- twinkling stars -->
  <circle class="star" cx="60" cy="40" r="2" style="animation-delay:0s"/>
  <circle class="star" cx="140" cy="200" r="1.5" style="animation-delay:.6s"/>
  <circle class="star" cx="230" cy="60" r="2.2" style="animation-delay:1.2s"/>
  <circle class="star" cx="310" cy="150" r="1.4" style="animation-delay:1.8s"/>
  <circle class="star" cx="400" cy="30" r="2" style="animation-delay:2.4s"/>
  <circle class="star" cx="470" cy="220" r="1.6" style="animation-delay:.3s"/>
  <circle class="star" cx="560" cy="50" r="1.5" style="animation-delay:.9s"/>
  <circle class="star" cx="650" cy="25" r="2.2" style="animation-delay:1.5s"/>
  <circle class="star" cx="720" cy="210" r="1.4" style="animation-delay:2.1s"/>
  <circle class="star" cx="800" cy="70" r="2" style="animation-delay:.2s"/>
  <circle class="star" cx="880" cy="180" r="1.6" style="animation-delay:.8s"/>
  <circle class="star" cx="950" cy="40" r="2.2" style="animation-delay:1.4s"/>
  <circle class="star" cx="1040" cy="210" r="1.5" style="animation-delay:2s"/>
  <circle class="star" cx="1110" cy="60" r="2" style="animation-delay:2.6s"/>
  <circle class="star" cx="1160" cy="150" r="1.4" style="animation-delay:.5s"/>
  <circle class="star" cx="90" cy="130" r="1.3" style="animation-delay:1.1s"/>
  <circle class="star" cx="520" cy="130" r="1.2" style="animation-delay:1.7s"/>
  <circle class="star" cx="1000" cy="260" r="1.4" style="animation-delay:2.3s"/>

  <!-- floating code symbols -->
  <text class="sym" x="90" y="260" style="animation-delay:0s">&lt;/&gt;</text>
  <text class="sym" x="260" y="120" style="animation-delay:-3s">{ }</text>
  <text class="sym" x="930" y="110" style="animation-delay:-5s">py</text>
  <text class="sym" x="1080" y="250" style="animation-delay:-2s">kt</text>
  <text class="sym" x="760" y="270" style="animation-delay:-7s">;</text>
  <text class="sym" x="420" y="280" style="animation-delay:-4s">( )</text>

  <!-- light sweep -->
  <rect class="scan" x="0" y="0" width="400" height="320" fill="url(#scan)"/>

  <!-- text -->
  <text class="title" x="600" y="150" text-anchor="middle" fill="url(#name)" filter="url(#glow)">LAVANYA</text>
  <text class="sub" x="600" y="198" text-anchor="middle">COMPUTER SCIENCE ENGINEERING STUDENT</text>
  <text class="tag" x="600" y="236" text-anchor="middle">Python  •  JavaScript  •  Kotlin  •  Android</text>

  <!-- moving waves -->
  <path class="w1" d="M0 268 Q75 240 150 268 T300 268 T450 268 T600 268 T750 268 T900 268 T1050 268 T1200 268 T1350 268 T1500 268 V320 H0 Z"/>
  <path class="w2" d="M0 288 Q75 266 150 288 T300 288 T450 288 T600 288 T750 288 T900 288 T1050 288 T1200 288 T1350 288 T1500 288 V320 H0 Z"/>
</svg>
