<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .dot { fill: #e0f2fe; animation: run 5s ease-in-out infinite alternate; }
    @keyframes run { from { transform: translateX(-420px); opacity: .4; } to { transform: translateX(420px); opacity: 1; } }
  </style>
  <rect x="0" y="11" width="1200" height="2" fill="url(#line)" opacity=".55"/>
  <circle class="dot" cx="600" cy="12" r="5"/>
</svg>
